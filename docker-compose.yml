services:
  telebot:
    build: .
    container_name: telebot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Keep-alive HTTP server.
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      # All persistent data is in Turso; this volume only stores the
      # disposable Pyrogram session.
      - ./data:/app/data
    stop_grace_period: 15s
